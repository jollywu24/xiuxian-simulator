name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/test-web.yml

  deploy:
    needs: quality
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published main
        uses: actions/checkout@v6
        with:
          path: published
      - name: Checkout optional combat preview
        id: combat-preview
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          ref: codex/combat-lab
          path: combat-preview
      - name: Add combat preview without replacing the published root
        if: steps.combat-preview.outcome == 'success'
        run: |
          mkdir -p published/web/combat-lab
          cp -R combat-preview/web/. published/web/combat-lab/
      - name: Stamp published build
        id: build
        shell: bash
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          sed -i "s/data-build-sha=\"dev\"/data-build-sha=\"${short_sha}\"/" published/web/index.html
          grep -F "data-build-sha=\"${short_sha}\"" published/web/index.html
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: published/web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Locate Chrome
        shell: bash
        run: |
          chrome_bin="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$chrome_bin"
          echo "CHROME_BIN=$chrome_bin" >> "$GITHUB_ENV"
      - name: Verify deployed resource contract
        working-directory: published
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_BUILD_SHA: ${{ steps.build.outputs.short_sha }}
        run: node scripts/smoke-deployed.mjs
      - name: Run deployed browser smoke
        working-directory: published
        env:
          BROWSER_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_BUILD_SHA: ${{ steps.build.outputs.short_sha }}
        run: npm run smoke:online
